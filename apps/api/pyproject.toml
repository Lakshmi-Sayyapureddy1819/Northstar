[project]
name = "northstar-api"
version = "0.0.0"
description = "NorthStar API — FastAPI modular monolith. See docs/architecture/blueprint.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar"]
