version: 2

# Keeps NorthStar's dependencies current across all three ecosystems in the
# monorepo (Phase 0 maintainability). Updates are grouped to reduce PR noise and
# every PR must pass the full CI guardrail suite (.github/workflows/ci.yml)
# before it can merge.

updates:
  # 1) GitHub Actions used by our workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # 2) JavaScript/TypeScript deps (pnpm workspaces resolve from the root lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-dev-dependencies:
        dependency-type: development
      js-production-dependencies:
        dependency-type: production
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # 3) Python backend deps (uv project + uv.lock).
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
